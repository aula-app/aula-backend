[PHP]

;;;;;;;;;;;;;;;;;;;
; Resource Limits ;
;;;;;;;;;;;;;;;;;;;
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; File Uploads and Post Size ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
post_max_size = 20M
upload_max_filesize = 20M

; Realpath Cache
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; Output Buffering
output_buffering = On

;;;;;;;;;;;;;;;;;;;;
; Session Handling ;
;;;;;;;;;;;;;;;;;;;;
session.gc_maxlifetime = 1440
session.save_path = "/tmp"

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; CVE-2026-109618 CVE-2026-109619 ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
; https://www.php.net/archive/2026.php#2026-10-20-1
; https://www.vincentschmalbach.com/cve-2026-109618-and-cve-2026-109619-what-you-should-do-now/
; https://jackalsyn.com/posts/php-up-2026.html
; https://pentestit.com/php-cve-2026-109618-and-cve-2026-109619-what-we-know-about-php2shell/#cve-2026-109618-and-cve-2026-109619-detection
;
; Disable upload progress tracking in $_SESSION
; https://php.net/session.upload-progress.enabled
session.upload_progress.enabled = Off
; Whether to use strict session mode.
; Strict session mode does not accept an uninitialized session ID, and
; regenerates the session ID if the browser sends an uninitialized session ID.
; Strict mode protects applications from session fixation via a session adoption
; vulnerability. It is disabled by default for maximum compatibility, but
; enabling it is encouraged.
; https://wiki.php.net/rfc/strict_sessions
session.use_strict_mode = 1

;;;;;;;;;;;;;;;;;;;;
; Security and Safety ;
;;;;;;;;;;;;;;;;;;;;
disable_functions = exec,passthru,shell_exec,system

;;;;;;;;;;;;;;;;;;;;
; File Uploads ;
;;;;;;;;;;;;;;;;;;;;
file_uploads = On

;;;;;;;;;;;;;;;;;;;;
; Error Handling and Logging ;
;;;;;;;;;;;;;;;;;;;;
log_errors = On
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off

;;;;;;;;;;;;;;;;;;;;
; Other Settings ;
;;;;;;;;;;;;;;;;;;;;
; Add any other settings you might need for your specific application

; Hide X-Powered-By header
expose_php = Off


; Note: sodium should already be enabled and loaded by default with php-fpm:8.4 docker image
; extension=sodium
