# aula look for the pages Keycloak itself renders: errors, logout confirmation, info.
# Layered over keycloak.v2 (PatternFly 5); the templates stay stock, css/aula.css
# restyles them and messages/ rewords them. Select it per realm:
# Realm settings -> Themes -> Login theme.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/aula.css

# aula's login screen is light; the v2 dark switch would need a second palette.
darkMode=false

meta=theme-color==#65e07f
